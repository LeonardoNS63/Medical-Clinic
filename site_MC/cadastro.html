<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

    <div id="app">

        <header>
            <h1>Medical Clinic</h1>
            <p>Crie sua conta</p>
        </header>

        <main>
            <section id="secao-cadastro">
                <h2>Cadastro</h2>

                <div>
                    <label for="nome">Nome completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                    >
                    <span class="campo-erro" id="erro-nome"></span>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Digite seu email"
                        autocomplete="email"
                    >
                    <span class="campo-erro" id="erro-email"></span>
                </div>
                
                <div>
                    <label for="telefone">Telefone</label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        placeholder="(11) 91234-5678"
                        maxlength="15"
                        autocomplete="tel"
                    >
                    <span class="campo-erro" id="erro-telefone"></span>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                    >
                    <span class="campo-erro" id="erro-senha"></span>
                </div>

                <div>
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input 
                        type="password" 
                        id="confirmar-senha" 
                        placeholder="Repita sua senha"
                        autocomplete="new-password"
                    >
                    <span class="campo-erro" id="erro-confirmar-senha"></span>
                </div>

                <div>
                    <label>Tipo de perfil</label>

                    <div>
                        <label>
                            <input type="radio" name="role" id="role-paciente" value="PACIENTE" checked>
                            Paciente
                        </label>

                        <label>
                            <input type="radio" name="role" id="role-medico" value="MEDICO">
                            Médico
                        </label>
                    </div>

                    <span class="campo-erro" id="erro-role"></span>
                </div>

                <p id="mensagem-feedback" style="display: none;"></p>

                <button id="btn-cadastrar" onclick="cadastrar()">Criar conta</button>

                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </section>
        </main>

    </div>

    
    <script src="Scripts/cadastro.js"></script>

</body>
</html>
