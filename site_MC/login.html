<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Estilos/login.css">
    <script src="https://kit.fontawesome.com/f3aa759ed5.js" crossorigin="anonymous"></script>
    <title>Login — Clínica Médica</title>
</head>
<body>

    <div id="app">

        <header>
            <h1 id="Titulo">
                <i class="fa-solid fa-stethoscope"></i>
                Medical Clinic
            </h1>
            <p>Acesse sua conta</p>
        </header>

        <main>
            <section id="secao-login">
                <h2>Login</h2>

                <p id="mensagem-erro" style="display: none;"></p>

                <div id="email-input" class="inputs">
                    <label for="email"><i class="fa-regular fa-envelope"></i></label>
                    <input 
                        type="email" 
                        id="email"
                        class="input-login" 
                        placeholder="Digite seu email"
                        autocomplete="email"
                    >
                </div>

                <div id="senha-input" class="inputs">
                    <label for="senha"><i class="fa-solid fa-key"></i></label>
                    <input 
                        type="password" 
                        id="senha" 
                        class="input-login"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                    >
                </div>

                <!-- Mensagem de erro/feedback -->

                <div id="div-botao">
                    <button id="btn-login" onclick="login()">Entrar</button>
                </div>

                <p id="cadastro">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>

            </section>
            <br>
        </main>

    </div>

    <script src="Scripts/auth.js"></script>
    <script src="Scripts/login.js"></script>

</body>
</html>
